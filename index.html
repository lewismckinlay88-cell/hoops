<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Hail Hail Hoops – Guess the Celtic appearances</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0b6b3a;--gd:#06402a;--w:#fff;--bg:#f3f6f1;--ink:#10241a;--mut:#5b6e62;--gold:#e8b923;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#07150f;--ink:#eef5ef;--mut:#9db3a5;--card:#0e2418}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Source Sans 3',system-ui,sans-serif;min-height:100vh}
.hoops{height:34px;background:repeating-linear-gradient(90deg,var(--g) 0 28px,var(--w) 28px 56px)}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1,h2,.big{font-family:Oswald,Impact,sans-serif;text-transform:none;letter-spacing:.01em;margin:0}
h1{font-size:44px;line-height:1.05;color:var(--g)}
@media(prefers-color-scheme:dark){h1{color:#3fd486}}
p{margin:.6em 0}.mut{color:var(--mut)}
.card{background:var(--card,#fff);border-radius:14px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.08),0 0 0 1px rgba(11,107,58,.15)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px 18px;background:var(--g);color:#fff;width:100%;cursor:pointer;font-size:18px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.alt{background:transparent;color:var(--g);box-shadow:inset 0 0 0 2px var(--g)}
@media(prefers-color-scheme:dark){button.alt{color:#3fd486;box-shadow:inset 0 0 0 2px #3fd486}}
.top{display:flex;justify-content:space-between;font-weight:600;margin-bottom:10px}
.photo{position:relative;aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:var(--gd);display:grid;place-items:center}
.photo img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.photo svg{width:60%;opacity:.5}
.spin{width:38px;height:38px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;position:absolute}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:4s}}
.name{font-size:32px;margin:12px 0 0;line-height:1.1}
.val{font-family:Oswald,sans-serif;font-size:64px;font-weight:700;color:var(--g);text-align:center;line-height:1;margin:8px 0}
@media(prefers-color-scheme:dark){.val{color:#3fd486}}
input[type=range]{width:100%;accent-color:var(--g);height:34px}
.row{display:flex;gap:10px;align-items:center;margin:8px 0}
.row button{width:auto;padding:10px 14px;flex:1}
.num{width:100px;font:inherit;font-size:20px;padding:10px;border-radius:10px;border:2px solid var(--g);background:transparent;color:inherit;text-align:center}
.res{text-align:center}.res .big{font-size:56px;color:var(--g)}
.pts{font-family:Oswald,sans-serif;font-size:30px}
.final{font-size:96px;color:var(--g);text-align:center;line-height:1;font-family:Oswald,sans-serif;font-weight:700}
.label{font-family:Oswald,sans-serif;font-size:30px;text-align:center;margin:8px 0;line-height:1.15}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:6px 4px;border-top:1px solid rgba(11,107,58,.2)}td:nth-child(n+2){text-align:right}
.stack>*+*{margin-top:12px}
</style>
</head>

const POS={GK:'Goalkeeper',DF:'Defender',MF:'Midfielder',FW:'Forward'};
const PLAYERS=RAW.split('\n').map(l=>{const [n,p,y,a,w]=l.split('|');return{n,p:POS[p],y:y.endsWith('–')?y+'present':y,a:+a,w}});
const ROUNDS=10, MAX=800;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ð/g,'d').replace(/[łľ]/g,'l').toLowerCase();
const API='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=600&exintro=1&explaintext=1&exlimit=max';
const imgCache={};
async function getImg(p){
  if(p.n in imgCache)return imgCache[p.n];
  let src=null;
  try{
    const u=p.w?API+'&titles='+encodeURIComponent(p.w):API+'&generator=search&gsrlimit=5&gsrsearch='+encodeURIComponent(p.n+' Celtic footballer');
    const j=await(await fetch(u)).json();
    const pages=Object.values(j.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
    const sn=norm(p.n.split(' ').pop());
    for(const g of pages){
      if(g.thumbnail&&(p.w||(/Celtic/.test(g.extract||'')&&norm(g.title).includes(sn)))){src=g.thumbnail.source;break}
    }
  }catch(e){}
  if(!src){
    try{
      const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(p.w||p.n.replace(/ /g,'_')));
      const j=await r.json();
      if(j.thumbnail&&/Celtic|footballer/.test((j.extract||'')+(j.description||'')))src=j.thumbnail.source;
    }catch(e){}
  }
  return imgCache[p.n]=src;
}
let used=new Set(),game;
async function draw(){
  let last;
  for(let i=0;i<10;i++){
    let p;do{p=PLAYERS[Math.random()*PLAYERS.length|0]}while(used.has(p.n));
    used.add(p.n);last={p,img:await getImg(p)};
    if(last.img)return last;
  }
  return last;
}
const $=document.getElementById('app');
const SIL='<svg viewBox="0 0 100 100" fill="#fff"><circle cx="50" cy="34" r="18"/><path d="M14 96c0-24 16-38 36-38s36 14 36 38z"/></svg>';
function start(){
  used=new Set();game={r:0,scores:[],log:[],next:draw()};
  $.innerHTML=`<div class="stack"><h1>Hail Hail Hoops</h1>
  <p>We show you a player who pulled on the hoops. You guess how many competitive games he played for Celtic. Ten players, closest guess scores most.</p>
  <div class="card"><p style="margin:0">Appearances cover the Scottish league, Scottish Cup, League Cup and European competition, including sub appearances, up to 23 May 2026.</p></div>
  <button id="go">Kick off</button><p class="mut" id="best"></p></div>`;
  try{const b=localStorage.getItem('hc-best');if(b)document.getElementById('best').textContent='Your best: '+b+'%'}catch(e){}
  document.getElementById('go').onclick=round;
}
async function round(){
  $.innerHTML=`<div class="top"><span>Player ${game.r+1} of ${ROUNDS}</span><span>${game.scores.reduce((a,b)=>a+b,0)} pts</span></div><div class="photo"><div class="spin"></div></div>`;
  const cur=await game.next;game.cur=cur;
  game.next=game.r<ROUNDS-1?draw():null;
  const {p,img}=cur;
  $.innerHTML=`<div class="top"><span>Player ${game.r+1} of ${ROUNDS}</span><span>${game.scores.reduce((a,b)=>a+b,0)} pts</span></div>
  <div class="photo" id="ph">${img?`<img alt="${p.n}" src="${img}">`:SIL}</div>
  ${img?'':'<p class="mut" style="margin:4px 0 0;font-size:14px">No photo found for this player. If you see this every round, open the live site rather than a preview.</p>'}
  <h2 class="name">${p.n}</h2><p class="mut" style="margin:2px 0 8px">${p.p}, ${p.y}</p>
  <div class="card stack"><div class="mut" style="text-align:center">How many Celtic appearances?</div>
  <div class="val" id="v">400</div>
  <input type="range" id="s" min="0" max="${MAX}" value="400" aria-label="Appearances">
  <div class="row"><button class="alt" data-d="-10">−10</button><button class="alt" data-d="-1">−1</button><input class="num" id="n" type="number" min="0" max="${MAX}" value="400" inputmode="numeric" aria-label="Appearances"><button class="alt" data-d="1">+1</button><button class="alt" data-d="10">+10</button></div>
  <button id="lock">Lock it in</button></div>`;
  const ph=document.getElementById('ph'),im=ph.querySelector('img');
  if(im)im.onerror=()=>{ph.innerHTML=SIL};
  const s=document.getElementById('s'),n=document.getElementById('n'),v=document.getElementById('v');
  const set=x=>{x=Math.max(0,Math.min(MAX,Math.round(+x||0)));s.value=n.value=x;v.textContent=x};
  s.oninput=()=>set(s.value);n.oninput=()=>{v.textContent=Math.max(0,Math.min(MAX,+n.value||0));s.value=n.value};
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>set(+n.value+ +b.dataset.d));
  const lock=()=>reveal(+n.value||0);
  document.getElementById('lock').onclick=lock;
  n.onkeydown=e=>{if(e.key==='Enter')lock()};
}
function reveal(g){
  const {p}=game.cur,d=Math.abs(g-p.a),pts=Math.round(100*Math.max(0,1-d/p.a));
  game.scores.push(pts);game.log.push({n:p.n,g,a:p.a,pts});
  const last=game.r===ROUNDS-1;
  const msg=d===0?'Spot on!':d<=p.a*.1?'So close.':d<=p.a*.3?'Not bad.':'Way off.';
  $.innerHTML=`<div class="top"><span>Player ${game.r+1} of ${ROUNDS}</span><span>${game.scores.reduce((a,b)=>a+b,0)} pts</span></div>
  <div class="card stack res"><h2 class="name" style="margin:0">${p.n}</h2>
  <div class="mut">made</div><div class="big">${p.a}</div><div class="mut">Celtic appearances</div>
  <p>You said <b>${g}</b>, ${d?d+(g>p.a?' too high':' too low'):'exactly right'}. ${msg}</p>
  <div class="pts">+${pts} points</div>
  <button id="nx">${last?'See my rating':'Next player'}</button></div>`;
  document.getElementById('nx').onclick=()=>{game.r++;last?finish():round()};
}
function rating(x){
  return x>=80?'Paul the Tim?':x>=60?'You are definitely part of the Celtic family - Hail Hail brother':x>=40?'Part Timer':x>=20?'Have you ever even been to parkers?':'Current Bun';
}
function finish(){
  const pct=Math.round(game.scores.reduce((a,b)=>a+b,0)/ROUNDS),lab=rating(pct);
  let best=0;try{best=+localStorage.getItem('hc-best')||0;if(pct>best){localStorage.setItem('hc-best',pct);best=pct}}catch(e){}
  $.innerHTML=`<div class="stack"><h1>Full time</h1>
  <div class="card"><div class="final">${pct}%</div><div class="label">${lab}</div></div>
  <div class="card"><table>${game.log.map(l=>`<tr><td>${l.n}</td><td>${l.g} / ${l.a}</td><td>${l.pts}</td></tr>`).join('')}</table></div>
  <p class="mut" style="text-align:center">Your best: ${best}%</p>
  <button id="sh">Copy my score</button><button class="alt" id="again">Play again</button></div>`;
  document.getElementById('again').onclick=start;
  document.getElementById('sh').onclick=e=>{
    const t=`Hail Hail Hoops: I scored ${pct}% – "${lab}"`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>e.target.textContent='Copied!').catch(()=>e.target.textContent=t);
  };
}
start();
</script>
